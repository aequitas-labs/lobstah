<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80" role="img" aria-label="Pixel lobster carrying a star walks across the banner">
  <defs>
    <clipPath id="walk-frame"><rect width="72" height="56"/></clipPath>
  </defs>
  <g transform="translate(0 18)">
    <animateTransform attributeName="transform" type="translate" from="0 18" to="1200 18" dur="12s" repeatCount="indefinite"/>
    <g clip-path="url(#walk-frame)">
      <image href="data:image/png;base64," width="288" height="56" image-rendering="pixelated">
        <animate attributeName="x" values="0;-72;-144;-216" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="0.5s" repeatCount="indefinite"/>
      </image>
    </g>
    <image href="data:image/png;base64," x="56" y="-9" width="15" height="15" image-rendering="pixelated"/>
  </g>
</svg>
