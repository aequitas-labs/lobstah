name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: git --version
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # Exercise the Worker's SQL tests on both OSes (Node 20 has no node:sqlite).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm exec vitest run services/telemetry/test/worker.test.ts

  # TEMPORARY evidence job: removed before this PR is ready.
  windows-evidence:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build main beside this branch, for comparison
        shell: bash
        run: |
          git worktree add ../base origin/main
          cd ../base && pnpm install --frozen-lockfile && pnpm build
      - name: What holds a killed process's directory
        if: always() && matrix.replica == 1
        run: node scripts/tmp-windows-probes.mjs ebusy 100
      - name: PowerShell timings on an idle runner
        if: always()
        run: node scripts/tmp-windows-probes.mjs powershell 12 idle
      - name: Glass first launch on an idle runner, main and this branch alternating
        if: always()
        shell: bash
        run: LOBSTAH_PROBE_CLI=../base/apps/cli/dist/main.js node scripts/tmp-windows-probes.mjs glass 40
      - name: Full suite with the stall trace; process snapshot and glass sampled under its load
        if: always()
        shell: bash
        run: |
          rm -f stop.flag
          node scripts/tmp-windows-probes.mjs powershell-watch stop.flag suite > watch.log 2>&1 &
          LOBSTAH_PROBE_CLI=../base/apps/cli/dist/main.js node scripts/tmp-windows-probes.mjs glass 100000 stop.flag > glass.log 2>&1 &
          LOBSTAH_STALL_TRACE=stall-trace LOBSTAH_STALL_SLOW_MS=12000 pnpm test; code=$?
          touch stop.flag; wait
          echo "=== process snapshot latency under the suite's load"; cat watch.log
          echo "=== glass first launch under the suite's load"; cat glass.log
          echo "=== stall traces"; cat stall-trace/*.log || true
          exit $code
      - name: Affected tests, five consecutive runs
        if: always()
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "=== iteration $i"
            pnpm exec vitest run apps/cli/test/soak-listener.test.ts apps/cli/test/glass-lifecycle.test.ts packages/runner/test/reap.test.ts packages/runner/test/reuse.test.ts || exit 1
          done
