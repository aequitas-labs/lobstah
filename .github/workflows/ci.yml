name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: git --version
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The fast run first. A failed Windows run is retried once on one worker
      # (vitest.config.ts), which is slower but keeps the worker RPC channel up.
      - name: pnpm test
        shell: bash
        run: |
          if pnpm test; then exit 0; fi
          if [ "$RUNNER_OS" != "Windows" ]; then exit 1; fi
          echo "::warning::pnpm test failed on Windows with 2 workers; retrying once on 1 worker"
          LOBSTAH_TEST_WORKERS=1 pnpm test
      # Exercise the Worker's SQL tests on both OSes (Node 20 has no node:sqlite).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm exec vitest run services/telemetry/test/worker.test.ts
      - run: pnpm --filter @lobstah/wharf test
