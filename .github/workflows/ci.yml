name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: git --version
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # Exercise the Worker's SQL tests on both OSes (Node 20 has no node:sqlite).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm exec vitest run services/telemetry/test/worker.test.ts
      - run: pnpm --filter @lobstah/wharf test
